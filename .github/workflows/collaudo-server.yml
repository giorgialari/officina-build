# Collaudo del server di Memdoria (l'immagine Docker): un CLONE del server creato dentro la corsa, con dati vuoti, su una
# macchina Linux pulita di GitHub. Costruisce l'immagine dal codice, la accende con grafo e ricerca come sul server vero,
# poi lo prova come una persona: salute, salvare e cercare una memoria, copia di sicurezza. Non tocca nessun server vero.
name: Collaudo server
run-name: Collaudo server · ${{ inputs.riferimento }}

on:
  workflow_dispatch:
    inputs:
      riferimento:
        description: "Ramo o commit del codice da collaudare"
        default: main
  workflow_call:
    inputs:
      riferimento:
        type: string
        default: main
    secrets:
      CODICE_CHIAVE:
        required: true

permissions:
  contents: read

jobs:
  server:
    name: Il server su una macchina pulita
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/codice
        with:
          riferimento: ${{ inputs.riferimento }}
          chiave: ${{ secrets.CODICE_CHIAVE }}
      - name: Immagine del server (costruita dal codice)
        run: |
          V=$(cat codice/VERSION)
          echo "V=$V" >> "$GITHUB_ENV"
          scripts/riservato.sh immagine codice 'Successfully|DONE|naming to' -- \
            docker build -f deploy/server/Dockerfile --build-arg AI_BRAIN_VERSION="$V" -t "ai-brain-server:$V" .
      - name: Il server si accende (grafo, ricerca e brain, come sul server vero)
        run: |
          cat > codice/deploy/server/.env <<EOF
          AI_BRAIN_VERSION=$V
          AI_BRAIN_PUBLIC_URL=http://localhost:8765
          BRAIN_ALLOWED_HOSTS=localhost,127.0.0.1
          NEO4J_PASSWORD=$(openssl rand -hex 16)
          BRAIN_TOKEN=$(openssl rand -hex 24)
          MEILI_KEY=$(openssl rand -hex 24)
          EOF
          scripts/riservato.sh accensione codice/deploy/server 'Started|Healthy|running' -- \
            docker compose -f docker-compose.yml up -d grafo ricerca brain
      - name: Aspetta che risponda
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8765/health > /dev/null 2>&1 && { echo "Il server risponde dopo $((i*5)) secondi"; exit 0; }
            sleep 5
          done
          echo "Il server non risponde dopo 5 minuti"; exit 1
      - name: Lo provo come una persona (salvare, cercare, copia di sicurezza)
        run: |
          set -e
          T=$(grep '^BRAIN_TOKEN=' codice/deploy/server/.env | cut -d= -f2)
          H="Authorization: Bearer $T"
          curl -fsS -H "$H" http://127.0.0.1:8765/admin/stats > /dev/null && echo "OK   le statistiche rispondono"
          R=$(curl -fsS -X POST -H "$H" -H 'Content-Type: application/json' http://127.0.0.1:8765/admin/remember \
            -d '{"text":"Il cliente Verdi Srl usa il gestionale Alfa dal 2024.","kind":"fact","source":"collaudo","source_ai":"collaudo","entities":[{"name":"Verdi Srl","type":"client"}]}')
          echo "$R" | grep -q '"created"' && echo "OK   una memoria si salva"
          sleep 5
          curl -fsS -X POST -H "$H" -H 'Content-Type: application/json' http://127.0.0.1:8765/admin/search -d '{"query":"gestionale Alfa","limit":5}' \
            | grep -q 'Alfa' && echo "OK   la memoria si ritrova con la ricerca"
          S=$(curl -fsS -H "$H" http://127.0.0.1:8765/admin/stats)
          echo "$S" | grep -q '"memories":1' && echo "OK   il conto delle memorie e' giusto"
      - name: Il server si riavvia e le memorie ci sono ancora
        run: |
          set -e
          cd codice/deploy/server && docker compose -f docker-compose.yml restart brain > /dev/null
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:8765/health > /dev/null 2>&1 && break; sleep 5; done
          T=$(grep '^BRAIN_TOKEN=' .env | cut -d= -f2)
          curl -fsS -H "Authorization: Bearer $T" http://127.0.0.1:8765/admin/stats | grep -q '"memories":1' && echo "OK   dopo il riavvio le memorie ci sono"
      - name: Dettaglio cifrato (solo se rosso)
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/riservato"
          cd codice/deploy/server && docker compose -f docker-compose.yml logs --no-color --tail 300 > "$RUNNER_TEMP/riservato/server.log" 2>&1 || true
          openssl cms -encrypt -aes256 -binary -in "$RUNNER_TEMP/riservato/server.log" -out "$RUNNER_TEMP/riservato/server.cms" -outform DER "$GITHUB_WORKSPACE/registri.pem"
      - name: Allegato cifrato
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: registri-cifrati-server
          path: ${{ runner.temp }}/riservato/*.cms
          retention-days: 3
