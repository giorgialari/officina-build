# Il rilascio di Memdoria costruito e firmato interamente su macchine di GitHub (il Mac e l'MSI di casa possono essere spenti).
# Prima le prove e i collaudi (completo.yml); se sono verdi costruisce Windows, Mac e le immagini del server con la chiave
# vera (segreto CHIAVE_FIRMA) e le lascia come allegati CIFRATI. NON tocca nessun server: per metterle online si lancia a mano
# sul Mac scripts/scarica-e-pubblica.sh. Il registro mostra solo esiti e numeri.
name: Rilascio
run-name: Rilascio · ${{ inputs.riferimento }}

on:
  workflow_dispatch:
    inputs:
      riferimento:
        description: "Ramo o commit da rilasciare"
        default: main

permissions:
  contents: read

concurrency:
  group: rilascio
  cancel-in-progress: false

jobs:
  collaudi:
    uses: ./.github/workflows/completo.yml
    with:
      riferimento: ${{ inputs.riferimento }}
    secrets: inherit

  windows:
    name: Windows (firmato)
    needs: collaudi
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      AI_BRAIN_VENDOR: ${{ github.workspace }}\..\vendor
      AI_BRAIN_BUILD: ${{ github.workspace }}\..\build
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/codice
        with:
          riferimento: ${{ inputs.riferimento }}
          chiave: ${{ secrets.CODICE_CHIAVE }}
      - name: Modelli della ricerca
        shell: powershell
        working-directory: codice
        run: |
          python -m pip install --quiet "fastembed>=0.7.3,<0.8" onnxruntime==1.30.0
          $m = "$env:AI_BRAIN_VENDOR\common\models"
          New-Item -ItemType Directory -Force $m | Out-Null
          $env:FASTEMBED_CACHE_PATH = $m; $env:HF_HOME = "$m\huggingface"; $env:HF_HUB_DISABLE_XET = '1'; $env:PYTHONPATH = (Get-Location).Path
          python scripts\download_models.py *> $null
          exit $LASTEXITCODE
      - name: App e impronte
        shell: powershell
        working-directory: codice
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\riservato" | Out-Null
          powershell -NoProfile -ExecutionPolicy Bypass -File .\deploy\windows\build-windows.ps1 all *> "$env:RUNNER_TEMP\riservato\app.log"
          $esito = $LASTEXITCODE
          Write-Host "[windows] app e impronte: uscita $esito"
          if ($esito -eq 0) { Remove-Item "$env:RUNNER_TEMP\riservato\app.log" -Force }
          exit $esito
      - name: Firma con la chiave vera e installer
        shell: powershell
        working-directory: codice
        env:
          CHIAVE_FIRMA: ${{ secrets.CHIAVE_FIRMA }}
        run: |
          $ErrorActionPreference = 'Continue'
          $chiave = Join-Path $env:RUNNER_TEMP 'firma.pem'
          [IO.File]::WriteAllText($chiave, $env:CHIAVE_FIRMA)
          $versione = (Get-Content VERSION -TotalCount 1).Trim()
          python -m pip install --quiet cryptography
          python backend\app\integrita.py firma "$env:AI_BRAIN_BUILD\AI Brain\runtime\app\impronte.json" --chiave $chiave --versione $versione --sistema windows
          $esito = $LASTEXITCODE
          Remove-Item $chiave -Force
          if ($esito -ne 0) { exit $esito }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\deploy\windows\build-windows.ps1 installer *> "$env:RUNNER_TEMP\riservato\installer.log"
          $esito = $LASTEXITCODE
          Write-Host "[windows] installer: uscita $esito"
          if ($esito -eq 0) { Remove-Item "$env:RUNNER_TEMP\riservato\installer.log" -Force }
          exit $esito
      - name: Allegato cifrato
        shell: bash
        run: scripts/proteggi.sh codice/deploy/dist protetto '*-windows-x64.exe'
      - uses: actions/upload-artifact@v4
        with:
          name: rilascio-windows
          path: protetto/
          retention-days: 3
          compression-level: 0
      - name: Dettaglio cifrato (solo se rosso)
        if: failure()
        shell: bash
        run: scripts/cifra.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: registri-cifrati-rilascio-windows
          path: ${{ runner.temp }}/riservato/*.cms
          retention-days: 3

  mac:
    name: Mac (firmato)
    needs: collaudi
    runs-on: macos-14
    timeout-minutes: 120
    env:
      AI_BRAIN_VENDOR: ${{ github.workspace }}/../vendor
      AI_BRAIN_BUILD: ${{ github.workspace }}/../build
      AI_BRAIN_DIST: ${{ github.workspace }}/../dist
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/codice
        with:
          riferimento: ${{ inputs.riferimento }}
          chiave: ${{ secrets.CODICE_CHIAVE }}
      - name: Node (quello dell'app)
        run: echo "NODE=$(grep '^NODE_VERSION=' codice/deploy/comune/versions.env | cut -d= -f2 | tr -d v)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE }}
      - name: Pagine
        run: scripts/riservato.sh pagine codice 'built|Successfully|error' -- bash deploy/comune/pagine.sh "$RUNNER_TEMP/pagine"
      - name: Modelli della ricerca
        run: |
          python3 -m pip install --quiet --break-system-packages "fastembed>=0.7.3,<0.8" onnxruntime==1.30.0 2>/dev/null || python3 -m pip install --quiet "fastembed>=0.7.3,<0.8" onnxruntime==1.30.0
          M="$AI_BRAIN_VENDOR/common/models"; mkdir -p "$M"
          cd codice && FASTEMBED_CACHE_PATH="$M" HF_HOME="$M/huggingface" HF_HUB_DISABLE_XET=1 PYTHONPATH="$PWD" python3 scripts/download_models.py > /dev/null 2>&1
      - name: Il dmg (firmato con la chiave vera)
        env:
          CHIAVE_FIRMA: ${{ secrets.CHIAVE_FIRMA }}
          AI_BRAIN_PAGINE: ${{ runner.temp }}/pagine
        run: |
          pip3 install --quiet --break-system-packages cryptography 2>/dev/null || pip3 install --quiet cryptography
          umask 077; printf '%s\n' "$CHIAVE_FIRMA" > "$RUNNER_TEMP/firma.pem"
          export AI_BRAIN_CHIAVE_LICENZE="$RUNNER_TEMP/firma.pem"
          esito=0
          scripts/riservato.sh dmg codice 'dmg|Pronto' -- bash deploy/mac/build-mac.sh release || esito=$?
          rm -f "$RUNNER_TEMP/firma.pem"
          exit $esito
      - name: Allegato cifrato
        run: scripts/proteggi.sh "$AI_BRAIN_DIST" protetto '*-mac-arm64.dmg'
      - uses: actions/upload-artifact@v4
        with:
          name: rilascio-mac
          path: protetto/
          retention-days: 3
          compression-level: 0
      - name: Dettaglio cifrato (solo se rosso)
        if: failure()
        run: scripts/cifra.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: registri-cifrati-rilascio-mac
          path: ${{ runner.temp }}/riservato/*.cms
          retention-days: 3

  server:
    name: Immagine server ${{ matrix.arch }} (firmata)
    needs: collaudi
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      ARCH: ${{ matrix.arch }}
      IMMAGINE_MASSIMO_MB: 1000
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/codice
        with:
          riferimento: ${{ inputs.riferimento }}
          chiave: ${{ secrets.CODICE_CHIAVE }}
      - uses: docker/setup-buildx-action@v3
      - name: Immagine, firma, compressione e controlli
        env:
          CHIAVE_FIRMA: ${{ secrets.CHIAVE_FIRMA }}
        run: |
          set -e
          cd codice
          V=$(tr -d ' \n' < VERSION)
          python3 -m pip install --quiet cryptography
          ../scripts/riservato.sh immagine . 'naming to|DONE' -- \
            docker buildx build -f deploy/server/Dockerfile --platform "linux/$ARCH" --build-arg STRIP_SOURCES=1 --build-arg AI_BRAIN_VERSION="$V" \
              -t "ai-brain-server:$V-$ARCH-base" --load .
          id=$(docker create --platform "linux/$ARCH" "ai-brain-server:$V-$ARCH-base")
          mkdir -p impronte rilascio
          docker cp "$id:/app/impronte.json" impronte/impronte.json
          docker rm "$id" > /dev/null
          umask 077; printf '%s\n' "$CHIAVE_FIRMA" > "$RUNNER_TEMP/firma.pem"
          python3 backend/app/integrita.py firma impronte/impronte.json --chiave "$RUNNER_TEMP/firma.pem" --versione "$V" --sistema server
          rm -f "$RUNNER_TEMP/firma.pem"
          id=$(docker create --platform "linux/$ARCH" "ai-brain-server:$V-$ARCH-base")
          docker cp impronte/impronte.json.firma "$id:/app/impronte.json.firma"
          docker commit "$id" "ai-brain-server:$V" > /dev/null
          docker rm "$id" > /dev/null
          STRATI=$(docker image inspect --format '{{json .RootFS.Layers}}' "ai-brain-server:$V")
          docker save "ai-brain-server:$V" -o "$RUNNER_TEMP/salvata.tar"
          python3 deploy/server/comprimi_immagine.py "$RUNNER_TEMP/salvata.tar" "rilascio/ai-brain-server-$V-$ARCH.tar"
          rm -f "$RUNNER_TEMP/salvata.tar"
          BYTE=$(stat -c %s "rilascio/ai-brain-server-$V-$ARCH.tar")
          [ "$BYTE" -le $((IMMAGINE_MASSIMO_MB * 1000 * 1000)) ] || { echo "L'immagine $ARCH pesa piu' di $IMMAGINE_MASSIMO_MB MB"; exit 1; }
          docker image rm "ai-brain-server:$V" "ai-brain-server:$V-$ARCH-base" > /dev/null
          docker load -i "rilascio/ai-brain-server-$V-$ARCH.tar" > /dev/null
          [ "$(docker image inspect --format '{{json .RootFS.Layers}}' "ai-brain-server:$V")" = "$STRATI" ] || { echo "Strati diversi dopo la compressione"; exit 1; }
          docker run --rm --platform "linux/$ARCH" --entrypoint python "ai-brain-server:$V" -B -c "import sys; sys.path.insert(0, '/app'); import integrita; sys.exit(integrita.main(['controlla']))"
          docker run --rm --platform "linux/$ARCH" --entrypoint python "ai-brain-server:$V" -B -c "import pathlib, sys; sys.exit(0 if pathlib.Path('/app/web-brain/index.html').is_file() else 1)"
          echo "[server $ARCH] immagine firmata e controllata ($((BYTE / 1000000)) MB)"
      - name: Allegato cifrato
        run: scripts/proteggi.sh codice/rilascio protetto '*.tar'
      - uses: actions/upload-artifact@v4
        with:
          name: rilascio-server-${{ matrix.arch }}
          path: protetto/
          retention-days: 3
          compression-level: 0

  pronto:
    name: Pronto da pubblicare
    needs: [windows, mac, server]
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "Windows, Mac e server costruiti e firmati."
          echo "Per metterli online, sul tuo Mac: scripts/scarica-e-pubblica.sh ${{ github.run_id }} <cartella di ai-brain>"
