# Collaudo e rilascio di Memdoria, tutto su macchine di GitHub (il Mac e l'MSI di casa possono restare spenti).
#   1. Prove del codice (workflow «Prove»), collaudo di Windows, collaudo di Mac, collaudo del server: in parallelo, su macchine
#      pulite, con una CHIAVE DI PROVA (generata a ogni corsa) al posto di quella vera.
#   2. Se «solo_collaudo» e' spenta e tutto e' verde: costruisce Windows, Mac e le immagini del server con la chiave VERA
#      (segreto CHIAVE_FIRMA) e le lascia come allegati CIFRATI (aprirli e pubblicarli: scripts/scarica-e-pubblica.sh, sul Mac).
# Non tocca nessun server. Il registro mostra solo esiti e numeri; i dettagli degli errori sono in allegati cifrati.
name: Collaudo e rilascio
run-name: ${{ inputs.solo_collaudo && 'Collaudo' || 'Collaudo e rilascio' }} · ${{ inputs.riferimento }}
'on':
  workflow_dispatch:
    inputs:
      riferimento:
        description: Ramo o commit del codice (la versione nuova)
        default: main
      solo_collaudo:
        description: 'Solo prove e collaudi: non costruisce il rilascio'
        type: boolean
        default: true
      versioni:
        description: 'Versioni di prima da collaudare nell''aggiornamento, separate da virgole (es. 1.0.25,1.0.30). Vuoto: quelle di versioni-in-uso.json'
        default: ''
permissions:
  contents: read
concurrency:
  group: rilascio
  cancel-in-progress: false
jobs:
  versioni:
    name: Versioni di prima da collaudare
    runs-on: ubuntu-24.04
    outputs:
      matrice: ${{ steps.v.outputs.matrice }}
      collaudi: ${{ steps.v.outputs.collaudi }}
      primo: ${{ steps.v.outputs.primo }}
      primo_nome: ${{ steps.v.outputs.primo_nome }}
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/codice
      with:
        riferimento: ${{ inputs.riferimento }}
        chiave: ${{ secrets.CODICE_CHIAVE }}
    - id: v
      name: Trova il commit di ogni versione
      env:
        ELENCO: ${{ inputs.versioni }}
      run: |
        if [ -z "$ELENCO" ]; then ELENCO=$(python3 -c "import json;print(','.join(json.load(open('versioni-in-uso.json'))))"); fi
        scripts/risolvi-versioni.sh codice "${{ inputs.riferimento }}" "$ELENCO" | cut -c1-200
  prove:
    uses: ./.github/workflows/prove.yml
    with:
      riferimento: ${{ inputs.riferimento }}
    secrets: inherit
  win-chiavi:
    name: Windows · chiave di prova
    runs-on: ubuntu-24.04
    outputs:
      pubblica: ${{ steps.k.outputs.pubblica }}
    steps:
    - uses: actions/checkout@v4
    - id: k
      name: Chiave di prova (fissa, nel repo)
      run: |
        echo "pubblica=$(cat chiave-prova/pubblica.txt)" >> "$GITHUB_OUTPUT"
    - uses: actions/upload-artifact@v4
      with:
        name: chiave-prova
        path: chiave-prova/chiave-privata.pem
        retention-days: 1
  win-costruisci:
    name: Windows · costruisce ${{ matrix.nome }}
    needs:
    - win-chiavi
    - versioni
    runs-on: windows-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.versioni.outputs.matrice) }}
    env:
      AI_BRAIN_VENDOR: ${{ github.workspace }}\..\vendor
      AI_BRAIN_BUILD: ${{ github.workspace }}\..\build
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: chiave-prova
        path: chiave
    - id: inst
      name: 'Installer di questa versione gia'' costruito? (cache: una versione uscita non cambia)'
      if: ${{ matrix.nome != 'nuovo' }}
      uses: actions/cache@v4
      with:
        path: pronto
        key: inst-win-${{ matrix.riferimento }}-${{ hashFiles('chiave-prova/pubblica.txt') }}-v1
    - name: Codice (copia di sola lettura, chiave dedicata)
      env:
        CODICE_CHIAVE: ${{ secrets.CODICE_CHIAVE }}
        RIFERIMENTO: ${{ matrix.riferimento }}
      run: |
        mkdir -p ~/.ssh
        printf '%s\n' "$CODICE_CHIAVE" > ~/.ssh/codice
        chmod 600 ~/.ssh/codice
        ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
        export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/codice -o IdentitiesOnly=yes"
        git clone --quiet git@github.com:giorgialari/ai-brain.git codice
        git -C codice checkout --quiet "$RIFERIMENTO"
        rm -f ~/.ssh/codice
        echo "Codice: $(git -C codice rev-parse --short HEAD), versione $(cat codice/VERSION)"
    - name: Pezzi scaricati e runtime di base (cache)
      if: ${{ matrix.nome == 'nuovo' }}
      uses: actions/cache@v4
      with:
        path: ${{ env.AI_BRAIN_VENDOR }}
        key: vendor-inst-win-${{ hashFiles('codice/deploy/comune/versions.env', 'codice/backend/requirements*.txt', 'codice/deploy/comune/requirements-*.txt') }}-v1
    - name: Chiave pubblica di prova al posto di quella vera
      env:
        PUBBLICA: ${{ needs.win-chiavi.outputs.pubblica }}
      run: |
        for f in codice/backend/app/integrita.py codice/backend/app/licenza.py; do
          [ -f "$f" ] && sed -i "s/m_QL-tOfVLrSvzxol1xv06rGbLooUUh5YLFlwyOxHxw/$PUBBLICA/" "$f"
        done
        grep -l "$PUBBLICA" codice/backend/app/*.py | wc -l
      if: ${{ matrix.nome == 'nuovo' || steps.inst.outputs.cache-hit != 'true' }}
    - name: Modelli della ricerca (gli stessi dell'immagine del server, scaricati qui)
      shell: powershell
      working-directory: codice
      run: |
        $ErrorActionPreference = 'Continue'
        python -m pip install --quiet "fastembed>=0.7.3,<0.8" onnxruntime==1.30.0
        $m = "$env:AI_BRAIN_VENDOR\common\models"
        New-Item -ItemType Directory -Force $m | Out-Null
        $env:FASTEMBED_CACHE_PATH = $m
        $env:HF_HOME = "$m\huggingface"
        $env:HF_HUB_DISABLE_XET = '1'
        $env:PYTHONPATH = (Get-Location).Path
        python scripts\download_models.py
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      if: ${{ matrix.nome == 'nuovo' || steps.inst.outputs.cache-hit != 'true' }}
    - name: App e impronte
      shell: powershell
      working-directory: codice
      run: |
        $ErrorActionPreference = 'Continue'
        powershell -NoProfile -ExecutionPolicy Bypass -File .\deploy\windows\build-windows.ps1 all
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      if: ${{ matrix.nome == 'nuovo' || steps.inst.outputs.cache-hit != 'true' }}
    - name: Firma con la chiave di prova e installer
      shell: powershell
      working-directory: codice
      run: |
        $ErrorActionPreference = 'Continue'
        $versione = (Get-Content VERSION -TotalCount 1).Trim()
        $elenco = "$env:AI_BRAIN_BUILD\AI Brain\runtime\app\impronte.json"
        python -m pip install --quiet cryptography
        if (Test-Path backend\app\integrita.py) { python backend\app\integrita.py firma $elenco --chiave "$env:GITHUB_WORKSPACE\chiave\chiave-privata.pem" --versione $versione --sistema windows }
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        powershell -NoProfile -ExecutionPolicy Bypass -File .\deploy\windows\build-windows.ps1 installer
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      if: ${{ matrix.nome == 'nuovo' || steps.inst.outputs.cache-hit != 'true' }}
    - name: L'installer nella cartella «pronto» (cache e allegato)
      if: ${{ matrix.nome == 'nuovo' || steps.inst.outputs.cache-hit != 'true' }}
      shell: bash
      run: mkdir -p pronto && cp codice/deploy/dist/AI-Brain-*-windows-x64.exe pronto/
    - uses: actions/upload-artifact@v4
      with:
        name: installer-${{ matrix.nome }}
        path: pronto/*.exe
        retention-days: 1
        compression-level: 0
  win-collauda:
    name: Windows · aggiorna da ${{ matrix.vecchia }}
    needs:
    - win-costruisci
    - versioni
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        path: pezzi
        pattern: '{installer-nuovo,installer-${{ matrix.vecchia }},chiave-prova}'
    - name: Codice per fare le licenze di prova (solo licenza.py)
      shell: bash
      env:
        CODICE_CHIAVE: ${{ secrets.CODICE_CHIAVE }}
        RIFERIMENTO: ${{ inputs.riferimento }}
      run: |
        mkdir -p ~/.ssh
        printf '%s\n' "$CODICE_CHIAVE" > ~/.ssh/codice
        chmod 600 ~/.ssh/codice
        ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
        GIT_SSH_COMMAND="ssh -i $HOME/.ssh/codice -o IdentitiesOnly=yes" git clone --quiet git@github.com:giorgialari/ai-brain.git codice
        git -C codice checkout --quiet "$RIFERIMENTO"
        rm -f ~/.ssh/codice
        python -m pip install --quiet cryptography
    - name: Browser per guardare la pagina vera
      shell: powershell
      working-directory: scripts
      run: |
        npm init -y | Out-Null
        npm install --silent playwright@1.49.1
        npx playwright install chromium
    - name: Collaudo
      shell: powershell
      run: |
        $vecchio = (Get-ChildItem pezzi\installer-${{ matrix.vecchia }}\*.exe).FullName
        $nuovo = (Get-ChildItem pezzi\installer-nuovo\*.exe).FullName
        $pulita = '${{ matrix.pulita }}' -eq 'true'
        if ($pulita) {
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\collaudo-windows.ps1 -Vecchio $vecchio -Nuovo $nuovo -Codice "$PWD\codice" -Chiave "$PWD\pezzi\chiave-prova\chiave-privata.pem" -ConPulita
        } else {
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\collaudo-windows.ps1 -Vecchio $vecchio -Nuovo $nuovo -Codice "$PWD\codice" -Chiave "$PWD\pezzi\chiave-prova\chiave-privata.pem"
        }
        exit $LASTEXITCODE
    - name: Dettaglio cifrato (solo se rosso)
      if: failure()
      shell: bash
      run: scripts/cifra.sh
    - name: Allegato cifrato
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: registri-cifrati-windows-${{ matrix.vecchia }}
        path: ${{ runner.temp }}/riservato/*.cms
        retention-days: 3
    if: ${{ !cancelled() && needs.versioni.outputs.collaudi != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.versioni.outputs.collaudi) }}
  mac-chiavi:
    name: Mac · chiave di prova
    runs-on: ubuntu-24.04
    outputs:
      pubblica: ${{ steps.k.outputs.pubblica }}
    steps:
    - uses: actions/checkout@v4
    - id: k
      name: Chiave di prova (fissa, nel repo)
      run: |
        echo "pubblica=$(cat chiave-prova/pubblica.txt)" >> "$GITHUB_OUTPUT"
    - uses: actions/upload-artifact@v4
      with:
        name: chiave-prova-mac
        path: chiave-prova/chiave-privata.pem
        retention-days: 1
  mac-costruisci:
    name: Mac · costruisce ${{ matrix.nome }}
    needs:
    - mac-chiavi
    - versioni
    runs-on: macos-14
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.versioni.outputs.matrice) }}
    env:
      AI_BRAIN_VENDOR: ${{ github.workspace }}/../vendor
      AI_BRAIN_BUILD: ${{ github.workspace }}/../build
      AI_BRAIN_DIST: ${{ github.workspace }}/../dist
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: chiave-prova-mac
        path: chiave
    - id: inst
      name: 'Installer di questa versione gia'' costruito? (cache: una versione uscita non cambia)'
      if: ${{ matrix.nome != 'nuovo' }}
      uses: actions/cache@v4
      with:
        path: pronto
        key: inst-mac-${{ matrix.riferimento }}-${{ hashFiles('chiave-prova/pubblica.txt') }}-v1
    - uses: ./.github/actions/codice
      with:
        riferimento: ${{ matrix.riferimento }}
        chiave: ${{ secrets.CODICE_CHIAVE }}
    - name: Pezzi scaricati e runtime di base (cache)
      if: ${{ matrix.nome == 'nuovo' }}
      uses: actions/cache@v4
      with:
        path: ${{ env.AI_BRAIN_VENDOR }}
        key: vendor-inst-mac-${{ hashFiles('codice/deploy/comune/versions.env', 'codice/backend/requirements*.txt', 'codice/deploy/comune/requirements-*.txt') }}-v1
    - name: Chiave pubblica di prova al posto di quella vera
      env:
        PUBBLICA: ${{ needs.mac-chiavi.outputs.pubblica }}
      run: |
        for f in codice/backend/app/integrita.py codice/backend/app/licenza.py; do
          [ -f "$f" ] && sed -i '' "s/m_QL-tOfVLrSvzxol1xv06rGbLooUUh5YLFlwyOxHxw/$PUBBLICA/" "$f"
        done
        grep -l "$PUBBLICA" codice/backend/app/*.py | wc -l
      if: ${{ matrix.nome == 'nuovo' || steps.inst.outputs.cache-hit != 'true' }}
    - name: Node (quello dell'app) e pagine
      run: |
        NODE=$(grep '^NODE_VERSION=' codice/deploy/comune/versions.env | cut -d= -f2 | tr -d v)
        echo "NODE=$NODE" >> "$GITHUB_ENV"
      if: ${{ matrix.nome == 'nuovo' || steps.inst.outputs.cache-hit != 'true' }}
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE }}
      if: ${{ matrix.nome == 'nuovo' || steps.inst.outputs.cache-hit != 'true' }}
    - name: Pagine
      run: |
        if [ -f codice/deploy/comune/pagine.sh ]; then
          scripts/riservato.sh pagine codice 'built|Successfully|error' -- bash deploy/comune/pagine.sh "$RUNNER_TEMP/pagine"
        else
          echo "Questa versione non ha pagine.sh: la pagina la costruisce lo script del dmg"
        fi
      if: ${{ matrix.nome == 'nuovo' || steps.inst.outputs.cache-hit != 'true' }}
    - name: uv (lo usa lo script del dmg per Python)
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh > /dev/null 2>&1
        test -x "$HOME/.local/bin/uv" && echo "uv pronto"
      if: ${{ matrix.nome == 'nuovo' || steps.inst.outputs.cache-hit != 'true' }}
    - name: Modelli della ricerca
      run: |
        python3 -m pip install --quiet --break-system-packages "fastembed>=0.7.3,<0.8" onnxruntime==1.30.0 2>/dev/null || python3 -m pip install --quiet "fastembed>=0.7.3,<0.8" onnxruntime==1.30.0
        M="$AI_BRAIN_VENDOR/common/models"; mkdir -p "$M"
        cd codice && FASTEMBED_CACHE_PATH="$M" HF_HOME="$M/huggingface" HF_HUB_DISABLE_XET=1 PYTHONPATH="$PWD" python3 scripts/download_models.py > /dev/null 2>&1
      if: ${{ matrix.nome == 'nuovo' || steps.inst.outputs.cache-hit != 'true' }}
    - name: Il dmg (firmato con la chiave di prova)
      env:
        AI_BRAIN_CHIAVE_LICENZE: ${{ github.workspace }}/chiave/chiave-privata.pem
        AI_BRAIN_PAGINE: ${{ runner.temp }}/pagine
      run: |
        pip3 install --quiet --break-system-packages cryptography 2>/dev/null || pip3 install --quiet cryptography
        # Le versioni di prima cercano la chiave sempre nello stesso posto: ce la mettiamo (quella di prova, di questa corsa)
        [ -d "$RUNNER_TEMP/pagine" ] || unset AI_BRAIN_PAGINE
        mkdir -p "$HOME/.config/ai-brain-licenze" && cp "$AI_BRAIN_CHIAVE_LICENZE" "$HOME/.config/ai-brain-licenze/chiave-privata.pem"
        scripts/riservato.sh dmg codice 'dmg|Pronto' -- bash deploy/mac/build-mac.sh release
      if: ${{ matrix.nome == 'nuovo' || steps.inst.outputs.cache-hit != 'true' }}
    - name: L'installer nella cartella «pronto» (cache e allegato)
      if: ${{ matrix.nome == 'nuovo' || steps.inst.outputs.cache-hit != 'true' }}
      shell: bash
      run: mkdir -p pronto && cp "$AI_BRAIN_DIST"/AI-Brain-*-mac-arm64.dmg pronto/
    - uses: actions/upload-artifact@v4
      with:
        name: dmg-${{ matrix.nome }}
        path: pronto/*.dmg
        retention-days: 1
        compression-level: 0
    - name: Dettaglio cifrato (solo se rosso)
      if: failure()
      run: scripts/cifra.sh
    - name: Allegato cifrato
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: registri-cifrati-mac-${{ matrix.nome }}
        path: ${{ runner.temp }}/riservato/*.cms
        retention-days: 3
  mac-collauda:
    name: Mac · aggiorna da ${{ matrix.vecchia }}
    needs:
    - mac-costruisci
    - versioni
    runs-on: macos-14
    timeout-minutes: 240
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        path: pezzi
        pattern: '{dmg-nuovo,dmg-${{ matrix.vecchia }},chiave-prova-mac}'
    - uses: ./.github/actions/codice
      with:
        riferimento: ${{ inputs.riferimento }}
        chiave: ${{ secrets.CODICE_CHIAVE }}
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Browser per guardare la pagina vera
      working-directory: scripts
      run: |
        npm init -y > /dev/null
        npm install --silent playwright@1.49.1
        npx playwright install chromium
    - name: Collaudo
      run: |
        VECCHIO=$(ls pezzi/dmg-${{ matrix.vecchia }}/*.dmg); NUOVO=$(ls pezzi/dmg-nuovo/*.dmg)
        CON_PULITA=${{ matrix.pulita }} bash scripts/collaudo-mac.sh "$PWD/$VECCHIO" "$PWD/$NUOVO" "$PWD/codice" "$PWD/pezzi/chiave-prova-mac/chiave-privata.pem"
    - name: Dettaglio cifrato (solo se rosso)
      if: failure()
      run: scripts/cifra.sh
    - name: Allegato cifrato
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: registri-cifrati-mac-${{ matrix.vecchia }}
        path: ${{ runner.temp }}/riservato/*.cms
        retention-days: 3
    if: ${{ !cancelled() && needs.versioni.outputs.collaudi != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.versioni.outputs.collaudi) }}
  srv-server:
    name: Server · installa e aggiorna
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/codice
      with:
        riferimento: ${{ inputs.riferimento }}
        chiave: ${{ secrets.CODICE_CHIAVE }}
    - name: La versione di prima (se c'e')
      if: ${{ needs.versioni.outputs.primo != '' }}
      uses: ./.github/actions/codice
      with:
        riferimento: ${{ needs.versioni.outputs.primo }}
        chiave: ${{ secrets.CODICE_CHIAVE }}
        cartella: codice-vecchio
    - uses: actions/download-artifact@v4
      with:
        name: chiave-prova
        path: chiave
    - name: Chiave pubblica di prova al posto di quella vera (nel codice nuovo e in quello di prima)
      env:
        PUBBLICA: ${{ needs.win-chiavi.outputs.pubblica }}
      run: |
        for c in codice codice-vecchio; do for f in $c/backend/app/integrita.py $c/backend/app/licenza.py; do [ -f "$f" ] && sed -i "s/m_QL-tOfVLrSvzxol1xv06rGbLooUUh5YLFlwyOxHxw/$PUBBLICA/" "$f"; done; done
        grep -l "$PUBBLICA" codice/backend/app/*.py | wc -l
    - name: Licenza del server (firmata con la chiave di prova)
      run: |
        pip install --quiet cryptography
        mkdir -p ~/.config/ai-brain-licenze && cp chiave/chiave-privata.pem ~/.config/ai-brain-licenze/chiave-privata.pem
        PYTHONPATH="$PWD/codice" python3 -c "import sys; sys.path.insert(0, 'codice/backend/app'); import licenza; print(licenza.issue('Collaudo server', '', '', '', licenza.PRIVATE_KEY_FILE, tipo='server'))" > "$RUNNER_TEMP/licenza-server.txt"
        test -s "$RUNNER_TEMP/licenza-server.txt" && echo "licenza del server creata"
    - name: Immagine nuova (costruita dal codice)
      run: |
        V=$(cat codice/VERSION)
        echo "V=$V" >> "$GITHUB_ENV"
        scripts/riservato.sh immagine-nuova codice 'naming to|DONE' -- docker build -f deploy/server/Dockerfile --build-arg AI_BRAIN_VERSION="$V" -t "ai-brain-server:$V" .
    - name: Immagine di prima
      if: ${{ needs.versioni.outputs.primo != '' }}
      run: |
        VV=$(cat codice-vecchio/VERSION)
        echo "VV=$VV" >> "$GITHUB_ENV"
        scripts/riservato.sh immagine-vecchia codice-vecchio 'naming to|DONE' -- docker build -f deploy/server/Dockerfile --build-arg AI_BRAIN_VERSION="$VV" -t "ai-brain-server:$VV" .
    - name: Il server si accende (la versione di prima se c'e', altrimenti la nuova)
      run: |
        cat > codice/deploy/server/.env <<EOF
        AI_BRAIN_VERSION=${VV:-$V}
        AI_BRAIN_PUBLIC_URL=http://localhost:8765
        BRAIN_ALLOWED_HOSTS=localhost,127.0.0.1
        NEO4J_PASSWORD=$(openssl rand -hex 16)
        BRAIN_TOKEN=$(openssl rand -hex 24)
        MEILI_KEY=$(openssl rand -hex 24)
        EOF
        cat > codice/deploy/server/ambiente.yml <<EOF
        services:
          brain:
            environment:
              AI_BRAIN_LICENSE_CHECK_URL: http://127.0.0.1:9/controlla
              AI_BRAIN_LICENSE_URL: http://127.0.0.1:9/attiva
        EOF
        cd codice/deploy/server
        C='docker compose -f docker-compose.yml -f ambiente.yml'
        $C up -d grafo ricerca > /dev/null 2>&1
        $C up --no-start brain > /dev/null 2>&1
        $C cp "$RUNNER_TEMP/licenza-server.txt" brain:/data/licenza.txt
        $GITHUB_WORKSPACE/scripts/riservato.sh accensione . 'Started|Healthy|running' -- $C up -d brain
        for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8765/health > /dev/null 2>&1 && break; sleep 5; done
    - name: Lo provo come una persona
      run: scripts/prova-server.sh codice/deploy/server scrivi
    - name: Si aggiorna alla versione nuova (i dati restano)
      if: ${{ needs.versioni.outputs.primo != '' }}
      run: |
        cd codice/deploy/server
        docker compose -f docker-compose.yml -f ambiente.yml stop brain > /dev/null 2>&1
        sed -i "s/^AI_BRAIN_VERSION=.*/AI_BRAIN_VERSION=$V/" .env
        ../../../scripts/riservato.sh aggiornamento . 'Started|Healthy|running' -- docker compose -f docker-compose.yml -f ambiente.yml up -d brain
    - name: Dopo l'aggiornamento o il riavvio le memorie ci sono ancora
      run: |
        if [ -z "${VV:-}" ]; then (cd codice/deploy/server && docker compose -f docker-compose.yml -f ambiente.yml restart brain > /dev/null); fi
        scripts/prova-server.sh codice/deploy/server verifica
    - name: Dettaglio cifrato (solo se rosso)
      if: failure()
      run: |
        mkdir -p "$RUNNER_TEMP/riservato"
        cd codice/deploy/server && docker compose -f docker-compose.yml -f ambiente.yml logs --no-color --tail 300 > "$RUNNER_TEMP/riservato/server.log" 2>&1 || true
        cd "$GITHUB_WORKSPACE" && scripts/cifra.sh
    - if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: registri-cifrati-server
        path: ${{ runner.temp }}/riservato/*.cms
        retention-days: 3
    needs:
    - versioni
    - win-chiavi
  windows:
    name: Rilascio · Windows firmato
    needs:
    - esito-collaudi
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      AI_BRAIN_VENDOR: ${{ github.workspace }}\..\vendor
      AI_BRAIN_BUILD: ${{ github.workspace }}\..\build
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/codice
      with:
        riferimento: ${{ inputs.riferimento }}
        chiave: ${{ secrets.CODICE_CHIAVE }}
    - name: Modelli della ricerca
      shell: powershell
      working-directory: codice
      run: |
        python -m pip install --quiet "fastembed>=0.7.3,<0.8" onnxruntime==1.30.0
        $m = "$env:AI_BRAIN_VENDOR\common\models"
        New-Item -ItemType Directory -Force $m | Out-Null
        $env:FASTEMBED_CACHE_PATH = $m; $env:HF_HOME = "$m\huggingface"; $env:HF_HUB_DISABLE_XET = '1'; $env:PYTHONPATH = (Get-Location).Path
        python scripts\download_models.py *> $null
        exit $LASTEXITCODE
    - name: App e impronte
      shell: powershell
      working-directory: codice
      run: |
        $ErrorActionPreference = 'Continue'
        New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\riservato" | Out-Null
        powershell -NoProfile -ExecutionPolicy Bypass -File .\deploy\windows\build-windows.ps1 all *> "$env:RUNNER_TEMP\riservato\app.log"
        $esito = $LASTEXITCODE
        Write-Host "[windows] app e impronte: uscita $esito"
        if ($esito -eq 0) { Remove-Item "$env:RUNNER_TEMP\riservato\app.log" -Force }
        exit $esito
    - name: Firma con la chiave vera e installer
      shell: powershell
      working-directory: codice
      env:
        CHIAVE_FIRMA: ${{ secrets.CHIAVE_FIRMA }}
      run: |
        $ErrorActionPreference = 'Continue'
        $chiave = Join-Path $env:RUNNER_TEMP 'firma.pem'
        [IO.File]::WriteAllText($chiave, $env:CHIAVE_FIRMA)
        $versione = (Get-Content VERSION -TotalCount 1).Trim()
        python -m pip install --quiet cryptography
        python backend\app\integrita.py firma "$env:AI_BRAIN_BUILD\AI Brain\runtime\app\impronte.json" --chiave $chiave --versione $versione --sistema windows
        $esito = $LASTEXITCODE
        Remove-Item $chiave -Force
        if ($esito -ne 0) { exit $esito }
        powershell -NoProfile -ExecutionPolicy Bypass -File .\deploy\windows\build-windows.ps1 installer *> "$env:RUNNER_TEMP\riservato\installer.log"
        $esito = $LASTEXITCODE
        Write-Host "[windows] installer: uscita $esito"
        if ($esito -eq 0) { Remove-Item "$env:RUNNER_TEMP\riservato\installer.log" -Force }
        exit $esito
    - name: Allegato cifrato
      shell: bash
      run: scripts/proteggi.sh codice/deploy/dist protetto '*-windows-x64.exe'
    - uses: actions/upload-artifact@v4
      with:
        name: rilascio-windows
        path: protetto/
        retention-days: 3
        compression-level: 0
    - name: Dettaglio cifrato (solo se rosso)
      if: failure()
      shell: bash
      run: scripts/cifra.sh
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: registri-cifrati-rilascio-windows
        path: ${{ runner.temp }}/riservato/*.cms
        retention-days: 3
    if: ${{ !inputs.solo_collaudo && needs.esito-collaudi.result == 'success' }}
  mac:
    name: Rilascio · Mac firmato
    needs:
    - esito-collaudi
    runs-on: macos-14
    timeout-minutes: 120
    env:
      AI_BRAIN_VENDOR: ${{ github.workspace }}/../vendor
      AI_BRAIN_BUILD: ${{ github.workspace }}/../build
      AI_BRAIN_DIST: ${{ github.workspace }}/../dist
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/codice
      with:
        riferimento: ${{ inputs.riferimento }}
        chiave: ${{ secrets.CODICE_CHIAVE }}
    - name: Node (quello dell'app)
      run: echo "NODE=$(grep '^NODE_VERSION=' codice/deploy/comune/versions.env | cut -d= -f2 | tr -d v)" >> "$GITHUB_ENV"
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE }}
    - name: Pagine
      run: |
        if [ -f codice/deploy/comune/pagine.sh ]; then
          scripts/riservato.sh pagine codice 'built|Successfully|error' -- bash deploy/comune/pagine.sh "$RUNNER_TEMP/pagine"
        else
          echo "Questa versione non ha pagine.sh: la pagina la costruisce lo script del dmg"
        fi
    - name: uv (lo usa lo script del dmg per Python)
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh > /dev/null 2>&1
        test -x "$HOME/.local/bin/uv" && echo "uv pronto"
    - name: Modelli della ricerca
      run: |
        python3 -m pip install --quiet --break-system-packages "fastembed>=0.7.3,<0.8" onnxruntime==1.30.0 2>/dev/null || python3 -m pip install --quiet "fastembed>=0.7.3,<0.8" onnxruntime==1.30.0
        M="$AI_BRAIN_VENDOR/common/models"; mkdir -p "$M"
        cd codice && FASTEMBED_CACHE_PATH="$M" HF_HOME="$M/huggingface" HF_HUB_DISABLE_XET=1 PYTHONPATH="$PWD" python3 scripts/download_models.py > /dev/null 2>&1
    - name: Il dmg (firmato con la chiave vera)
      env:
        CHIAVE_FIRMA: ${{ secrets.CHIAVE_FIRMA }}
        AI_BRAIN_PAGINE: ${{ runner.temp }}/pagine
      run: |
        pip3 install --quiet --break-system-packages cryptography 2>/dev/null || pip3 install --quiet cryptography
        umask 077; printf '%s\n' "$CHIAVE_FIRMA" > "$RUNNER_TEMP/firma.pem"
        export AI_BRAIN_CHIAVE_LICENZE="$RUNNER_TEMP/firma.pem"
        esito=0
        scripts/riservato.sh dmg codice 'dmg|Pronto' -- bash deploy/mac/build-mac.sh release || esito=$?
        rm -f "$RUNNER_TEMP/firma.pem"
        exit $esito
    - name: Allegato cifrato
      run: scripts/proteggi.sh "$AI_BRAIN_DIST" protetto '*-mac-arm64.dmg'
    - uses: actions/upload-artifact@v4
      with:
        name: rilascio-mac
        path: protetto/
        retention-days: 3
        compression-level: 0
    - name: Dettaglio cifrato (solo se rosso)
      if: failure()
      run: scripts/cifra.sh
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: registri-cifrati-rilascio-mac
        path: ${{ runner.temp }}/riservato/*.cms
        retention-days: 3
    if: ${{ !inputs.solo_collaudo && needs.esito-collaudi.result == 'success' }}
  server:
    name: Rilascio · immagine server ${{ matrix.arch }} firmata
    needs:
    - esito-collaudi
    strategy:
      matrix:
        include:
        - arch: amd64
          runner: ubuntu-24.04
        - arch: arm64
          runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      ARCH: ${{ matrix.arch }}
      IMMAGINE_MASSIMO_MB: 1000
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/codice
      with:
        riferimento: ${{ inputs.riferimento }}
        chiave: ${{ secrets.CODICE_CHIAVE }}
    - uses: docker/setup-buildx-action@v3
    - name: Immagine, firma, compressione e controlli
      env:
        CHIAVE_FIRMA: ${{ secrets.CHIAVE_FIRMA }}
      run: |
        set -e
        cd codice
        V=$(tr -d ' \n' < VERSION)
        python3 -m pip install --quiet cryptography
        ../scripts/riservato.sh immagine . 'naming to|DONE' -- \
          docker buildx build -f deploy/server/Dockerfile --platform "linux/$ARCH" --build-arg STRIP_SOURCES=1 --build-arg AI_BRAIN_VERSION="$V" \
            -t "ai-brain-server:$V-$ARCH-base" --load .
        id=$(docker create --platform "linux/$ARCH" "ai-brain-server:$V-$ARCH-base")
        mkdir -p impronte rilascio
        docker cp "$id:/app/impronte.json" impronte/impronte.json
        docker rm "$id" > /dev/null
        umask 077; printf '%s\n' "$CHIAVE_FIRMA" > "$RUNNER_TEMP/firma.pem"
        python3 backend/app/integrita.py firma impronte/impronte.json --chiave "$RUNNER_TEMP/firma.pem" --versione "$V" --sistema server
        rm -f "$RUNNER_TEMP/firma.pem"
        id=$(docker create --platform "linux/$ARCH" "ai-brain-server:$V-$ARCH-base")
        docker cp impronte/impronte.json.firma "$id:/app/impronte.json.firma"
        docker commit "$id" "ai-brain-server:$V" > /dev/null
        docker rm "$id" > /dev/null
        STRATI=$(docker image inspect --format '{{json .RootFS.Layers}}' "ai-brain-server:$V")
        docker save "ai-brain-server:$V" -o "$RUNNER_TEMP/salvata.tar"
        python3 deploy/server/comprimi_immagine.py "$RUNNER_TEMP/salvata.tar" "rilascio/ai-brain-server-$V-$ARCH.tar"
        rm -f "$RUNNER_TEMP/salvata.tar"
        BYTE=$(stat -c %s "rilascio/ai-brain-server-$V-$ARCH.tar")
        [ "$BYTE" -le $((IMMAGINE_MASSIMO_MB * 1000 * 1000)) ] || { echo "L'immagine $ARCH pesa piu' di $IMMAGINE_MASSIMO_MB MB"; exit 1; }
        docker image rm "ai-brain-server:$V" "ai-brain-server:$V-$ARCH-base" > /dev/null
        docker load -i "rilascio/ai-brain-server-$V-$ARCH.tar" > /dev/null
        [ "$(docker image inspect --format '{{json .RootFS.Layers}}' "ai-brain-server:$V")" = "$STRATI" ] || { echo "Strati diversi dopo la compressione"; exit 1; }
        docker run --rm --platform "linux/$ARCH" --entrypoint python "ai-brain-server:$V" -B -c "import sys; sys.path.insert(0, '/app'); import integrita; sys.exit(integrita.main(['controlla']))"
        docker run --rm --platform "linux/$ARCH" --entrypoint python "ai-brain-server:$V" -B -c "import pathlib, sys; sys.exit(0 if pathlib.Path('/app/web-brain/index.html').is_file() else 1)"
        echo "[server $ARCH] immagine firmata e controllata ($((BYTE / 1000000)) MB)"
    - name: Allegato cifrato
      run: scripts/proteggi.sh codice/rilascio protetto '*.tar'
    - uses: actions/upload-artifact@v4
      with:
        name: rilascio-server-${{ matrix.arch }}
        path: protetto/
        retention-days: 3
        compression-level: 0
    if: ${{ !inputs.solo_collaudo && needs.esito-collaudi.result == 'success' }}
  pronto:
    name: Rilascio · pronto da pubblicare
    needs:
    - windows
    - mac
    - server
    runs-on: ubuntu-24.04
    steps:
    - run: |
        echo "Windows, Mac e server costruiti e firmati."
        echo "Per metterli online, sul tuo Mac: scripts/scarica-e-pubblica.sh ${{ github.run_id }} <cartella di ai-brain>"
    if: ${{ !inputs.solo_collaudo }}
  esito-collaudi:
    name: Esito di tutti i collaudi
    needs:
    - prove
    - win-collauda
    - mac-collauda
    - srv-server
    - licenza-vera
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
    - env:
        ESITI: ${{ toJSON(needs) }}
      run: |
        echo "$ESITI" | python3 -c "import json,sys; n=json.load(sys.stdin); ko=[k for k,v in n.items() if v['result'] not in ('success','skipped')]; print('Collaudi rossi:', ', '.join(ko)) if ko else print('Prove e collaudi di Windows, Mac e server riusciti.'); sys.exit(1 if ko else 0)"
  licenza-vera:
    name: Licenza · attivazione con l'email e controllo periodico (servizio vero)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/codice
      with:
        riferimento: ${{ inputs.riferimento }}
        chiave: ${{ secrets.CODICE_CHIAVE }}
    - name: Attivazione, controllo e liberazione del posto con una licenza di collaudo
      env:
        EMAIL_COLLAUDO: ${{ secrets.LICENZA_COLLAUDO_EMAIL }}
        EMAIL_SCADUTA: ${{ secrets.LICENZA_SCADUTA_EMAIL }}
        EMAIL_BLOCCATA: ${{ secrets.LICENZA_BLOCCATA_EMAIL }}
        EMAIL_SERVER: ${{ secrets.LICENZA_SERVER_EMAIL }}
      run: |
        if [ -z "$EMAIL_COLLAUDO" ]; then echo "::warning::Manca il segreto LICENZA_COLLAUDO_EMAIL: salto il collaudo con il servizio vero"; exit 0; fi
        pip install --quiet cryptography
        python3 scripts/licenza-vera.py codice
