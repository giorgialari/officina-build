# Collaudo del Mac su una macchina pulita di GitHub: costruisce il dmg di prima e quello nuovo con una CHIAVE DI PROVA,
# installa la nuova da zero, poi installa la vecchia e la AGGIORNA DALL'APP. Non pubblica niente.
name: Collaudo Mac
run-name: Collaudo Mac · ${{ inputs.nuovo }}

on:
  workflow_dispatch:
    inputs:
      nuovo:
        description: "Ramo o commit del codice da collaudare"
        default: main
      vecchio:
        description: "Commit della versione di prima (di base la 1.0.30)"
        default: 2490f8a
  workflow_call:
    inputs:
      nuovo:
        type: string
        default: main
      vecchio:
        type: string
        default: 2490f8a
    secrets:
      CODICE_CHIAVE:
        required: true

permissions:
  contents: read

jobs:
  chiavi:
    name: Chiave di prova
    runs-on: ubuntu-24.04
    outputs:
      pubblica: ${{ steps.k.outputs.pubblica }}
    steps:
      - id: k
        run: |
          pip install --quiet cryptography
          python - <<'PY'
          import base64, os
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          k = Ed25519PrivateKey.generate()
          open("chiave-privata.pem", "wb").write(k.private_bytes(serialization.Encoding.PEM, serialization.PrivateFormat.PKCS8, serialization.NoEncryption()))
          pub = k.public_key().public_bytes(serialization.Encoding.Raw, serialization.PublicFormat.Raw)
          open(os.environ["GITHUB_OUTPUT"], "a").write("pubblica=" + base64.urlsafe_b64encode(pub).decode().rstrip("=") + "\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chiave-prova-mac
          path: chiave-privata.pem
          retention-days: 1

  costruisci:
    name: Costruisce ${{ matrix.nome }}
    needs: chiavi
    runs-on: macos-14
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        include:
          - nome: vecchio
            riferimento: ${{ inputs.vecchio }}
          - nome: nuovo
            riferimento: ${{ inputs.nuovo }}
    env:
      AI_BRAIN_VENDOR: ${{ github.workspace }}/../vendor
      AI_BRAIN_BUILD: ${{ github.workspace }}/../build
      AI_BRAIN_DIST: ${{ github.workspace }}/../dist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: chiave-prova-mac
          path: chiave
      - uses: ./.github/actions/codice
        with:
          riferimento: ${{ matrix.riferimento }}
          chiave: ${{ secrets.CODICE_CHIAVE }}
      - name: Chiave pubblica di prova al posto di quella vera
        env:
          PUBBLICA: ${{ needs.chiavi.outputs.pubblica }}
        run: |
          sed -i '' "s/m_QL-tOfVLrSvzxol1xv06rGbLooUUh5YLFlwyOxHxw/$PUBBLICA/" codice/backend/app/integrita.py codice/backend/app/licenza.py
          grep -c "$PUBBLICA" codice/backend/app/integrita.py codice/backend/app/licenza.py
      - name: Node (quello dell'app) e pagine
        run: |
          NODE=$(grep '^NODE_VERSION=' codice/deploy/comune/versions.env | cut -d= -f2 | tr -d v)
          echo "NODE=$NODE" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE }}
      - name: Pagine
        run: scripts/riservato.sh pagine codice 'built|Successfully|error' -- bash deploy/comune/pagine.sh "$RUNNER_TEMP/pagine"
      - name: Modelli della ricerca
        run: |
          python3 -m pip install --quiet --break-system-packages "fastembed>=0.7.3,<0.8" onnxruntime==1.30.0 2>/dev/null || python3 -m pip install --quiet "fastembed>=0.7.3,<0.8" onnxruntime==1.30.0
          M="$AI_BRAIN_VENDOR/common/models"; mkdir -p "$M"
          cd codice && FASTEMBED_CACHE_PATH="$M" HF_HOME="$M/huggingface" HF_HUB_DISABLE_XET=1 PYTHONPATH="$PWD" python3 scripts/download_models.py > /dev/null 2>&1
      - name: Il dmg (firmato con la chiave di prova)
        env:
          AI_BRAIN_CHIAVE_LICENZE: ${{ github.workspace }}/chiave/chiave-privata.pem
          AI_BRAIN_PAGINE: ${{ runner.temp }}/pagine
        run: |
          pip3 install --quiet --break-system-packages cryptography 2>/dev/null || pip3 install --quiet cryptography
          scripts/riservato.sh dmg codice 'dmg|Pronto' -- bash deploy/mac/build-mac.sh release
      - name: Il dmg in una cartella della corsa
        run: mkdir -p uscita && cp "$AI_BRAIN_DIST"/AI-Brain-*-mac-arm64.dmg uscita/
      - uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.nome }}
          path: uscita/*.dmg
          retention-days: 1
          compression-level: 0
      - name: Dettaglio cifrato (solo se rosso)
        if: failure()
        run: scripts/cifra.sh
      - name: Allegato cifrato
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: registri-cifrati-mac-${{ matrix.nome }}
          path: ${{ runner.temp }}/riservato/*.cms
          retention-days: 3

  collauda:
    name: Installa, aggiorna dall'app e controlla
    needs: costruisci
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: pezzi
      - uses: ./.github/actions/codice
        with:
          riferimento: ${{ inputs.nuovo }}
          chiave: ${{ secrets.CODICE_CHIAVE }}
      - name: Collaudo
        run: |
          VECCHIO=$(ls pezzi/dmg-vecchio/*.dmg); NUOVO=$(ls pezzi/dmg-nuovo/*.dmg)
          bash scripts/collaudo-mac.sh "$PWD/$VECCHIO" "$PWD/$NUOVO" "$PWD/codice" "$PWD/pezzi/chiave-prova-mac/chiave-privata.pem"
      - name: Dettaglio cifrato (solo se rosso)
        if: failure()
        run: scripts/cifra.sh
      - name: Allegato cifrato
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: registri-cifrati-mac
          path: ${{ runner.temp }}/riservato/*.cms
          retention-days: 3
